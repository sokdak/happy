name: Android APK build validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-apk-validation.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/happy-app/**'
      - 'patches/fix-react-native-audio-api-windows-build.cjs'
      - 'patches/fix-react-native-libsodium-windows-cmake.cjs'
      - 'scripts/android-build-compatibility.test.cjs'
      - 'scripts/postinstall.cjs'

permissions:
  contents: read

concurrency:
  group: android-apk-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate compatibility patches
        run: node --test scripts/android-build-compatibility.test.cjs

      - name: TypeScript typecheck
        run: pnpm --filter happy-app typecheck

      - name: Generate Android project
        working-directory: packages/happy-app
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build ARM64 release APK
        working-directory: packages/happy-app/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
