name: Publish scoped CLI

on:
  push:
    branches: [main]
    tags:
      - 'npm-publish/**'
    paths:
      - '.github/workflows/publish-cli.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/happy-cli/**'
      - 'packages/happy-wire/**'
      - 'scripts/postinstall.cjs'
      - 'scripts/prepare-fork-cli-package.cjs'
      - 'scripts/prepare-fork-cli-package.test.cjs'
      - 'scripts/verify-fork-cli-package.cjs'
      - 'scripts/verify-fork-cli-package.test.cjs'
      - 'scripts/publish-cli-workflow.test.cjs'
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a unique main prerelease or the manifest's stable version
        required: true
        default: main
        type: choice
        options:
          - main
          - stable
      expected_version:
        description: Required for stable; use npm-publish/<manifest-version> and dispatch that exact tag ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-scoped-cli-${{ (github.event_name == 'workflow_dispatch' && inputs.channel) || (startsWith(github.ref, 'refs/tags/npm-publish/') && 'stable') || 'main' }}
  cancel-in-progress: false

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test packaging policy
        run: >-
          node --test
          scripts/prepare-fork-cli-package.test.cjs
          scripts/verify-fork-cli-package.test.cjs
          scripts/publish-cli-workflow.test.cjs

      - name: Prepare scoped package metadata
        id: package
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REF: ${{ github.ref }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          MANUAL_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$FULL_REF" == "refs/heads/main" ]]; then
            node scripts/prepare-fork-cli-package.cjs main "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$FULL_REF" == refs/tags/npm-publish/* ]]; then
            node scripts/prepare-fork-cli-package.cjs stable "${FULL_REF#refs/tags/}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_CHANNEL" == "main" ]]; then
            if [[ "$FULL_REF" != "refs/heads/main" ]]; then
              echo "Manual main publishing must run from refs/heads/main, found $FULL_REF" >&2
              exit 1
            fi
            node scripts/prepare-fork-cli-package.cjs main "$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_CHANNEL" == "stable" ]]; then
            if [[ "$FULL_REF" != "refs/tags/$MANUAL_EXPECTED_VERSION" ]]; then
              echo "Manual stable publishing must run from refs/tags/$MANUAL_EXPECTED_VERSION, found $FULL_REF" >&2
              exit 1
            fi
            node scripts/prepare-fork-cli-package.cjs stable "$MANUAL_EXPECTED_VERSION"
          else
            echo "Unsupported publish trigger: event=$EVENT_NAME ref=$FULL_REF channel=$MANUAL_CHANNEL" >&2
            exit 1
          fi

      - name: Build bundled wire and test CLI
        run: |
          pnpm --filter @slopus/happy-wire --fail-if-no-match build
          pnpm --dir packages/happy-cli test

      - name: Pack the tested CLI
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/happy-cli-package"
          mkdir -p "$package_dir"
          pnpm --dir packages/happy-cli pack --pack-destination "$package_dir"
          mapfile -t tarballs < <(find "$package_dir" -maxdepth 1 -type f -name '*.tgz')
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one packed CLI tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify and clean-install the exact tarball
        run: |
          node scripts/verify-fork-cli-package.cjs verify '${{ steps.pack.outputs.tarball }}' '${{ steps.package.outputs.version }}'
          node scripts/verify-fork-cli-package.cjs smoke-install '${{ steps.pack.outputs.tarball }}' '${{ steps.package.outputs.version }}'

      - name: Check for an existing immutable version
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          LOCAL_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if registry_version="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>"$error_file")"; then
            if [[ "$registry_version" != "$PACKAGE_VERSION" ]]; then
              echo "Registry returned unexpected version: $registry_version" >&2
              exit 1
            fi
            registry_dir="$(mktemp -d)"
            npm pack "$PACKAGE_NAME@$PACKAGE_VERSION" --ignore-scripts --pack-destination "$registry_dir" >/dev/null
            mapfile -t registry_tarballs < <(find "$registry_dir" -maxdepth 1 -type f -name '*.tgz')
            if [[ "${#registry_tarballs[@]}" -ne 1 ]]; then
              echo "Expected exactly one registry tarball, found ${#registry_tarballs[@]}" >&2
              exit 1
            fi
            node scripts/verify-fork-cli-package.cjs compare "$LOCAL_TARBALL" "${registry_tarballs[0]}"
            echo 'version_exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eq 'E404|404 Not Found' "$error_file"; then
            echo 'version_exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Validate monotonic dist-tag promotion
        id: promotion
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          VERSION_EXISTS: ${{ steps.registry.outputs.version_exists }}
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if tagged_version="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" 2>"$error_file")"; then
            :
          elif grep -Eq 'E404|404 Not Found' "$error_file"; then
            tagged_version=''
          else
            cat "$error_file" >&2
            exit 1
          fi
          node scripts/verify-fork-cli-package.cjs assert-promotion "$DIST_TAG" "$PACKAGE_VERSION" "$tagged_version"
          if [[ "$VERSION_EXISTS" == 'true' ]]; then
            if [[ "$tagged_version" != "$PACKAGE_VERSION" ]]; then
              echo "Immutable version exists, but dist-tag $DIST_TAG points to ${tagged_version:-nothing}; refusing to move it." >&2
              exit 1
            fi
            echo "The identical immutable version and dist-tag already exist; leaving registry state unchanged."
          fi

      - name: Publish the tested tarball or perform a dry run
        if: steps.registry.outputs.version_exists != 'true'
        id: publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::warning::NPM_TOKEN is not configured; validating with a publish dry run.'
            npm publish "$TARBALL" --dry-run --ignore-scripts --access public --tag "$DIST_TAG"
            echo 'uploaded=false' >> "$GITHUB_OUTPUT"
            echo 'registry_expected=false' >> "$GITHUB_OUTPUT"
          else
            npm publish "$TARBALL" --ignore-scripts --access public --tag "$DIST_TAG"
            echo 'uploaded=true' >> "$GITHUB_OUTPUT"
            echo 'registry_expected=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the exact registry version and dist-tag
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          VERSION_EXISTS: ${{ steps.registry.outputs.version_exists }}
          PUBLISH_REGISTRY_EXPECTED: ${{ steps.publish.outputs.registry_expected }}
        run: |
          set -euo pipefail
          if [[ "$VERSION_EXISTS" != 'true' && "$PUBLISH_REGISTRY_EXPECTED" != 'true' ]]; then
            echo 'Registry verification skipped because this was a dry run for a new version.'
            exit 0
          fi

          for attempt in {1..12}; do
            registry_version="$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || true)"
            tagged_version="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" 2>/dev/null || true)"
            if [[ "$registry_version" == "$PACKAGE_VERSION" && "$tagged_version" == "$PACKAGE_VERSION" ]]; then
              node scripts/verify-fork-cli-package.cjs smoke-install "$PACKAGE_NAME@$PACKAGE_VERSION" "$PACKAGE_VERSION"
              exit 0
            fi
            echo "Waiting for npm propagation (attempt $attempt/12)..."
            sleep 5
          done

          echo "npm did not expose $PACKAGE_NAME@$PACKAGE_VERSION on dist-tag $DIST_TAG" >&2
          exit 1
